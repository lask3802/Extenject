name: CI 

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'README.md'
  workflow_dispatch: {}
      
jobs:
  buildAndTestForSupportedPlatforms:

    name: Build for ${{ matrix.targetPlatform }} on version ${{ matrix.unityVersion }}

    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - UnityProject
        assetsPath:
          - UnityProject
        unityVersion:
          - 6000.0.65f1
        targetPlatform:
          - Android # Build a Android standalone (il2cpp).
          - iOS # Build an iOS player (il2cpp).
          - StandaloneOSX # Build a macOS standalone.
          # Not supported platforms by GitHub actions:
          # - Windows Store # Build a standalone for Windows Store devices.
          # - PS4 # Build a Playstation 4 standalone.
        testMode:
          # - playmode
          - editmode

    steps:

      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache
      - name: Caching Unity Project Library
        uses: actions/cache@v4
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.projectPath }}-${{ matrix.targetPlatform }}-${{ hashFiles(matrix.projectPath) }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-${{ matrix.targetPlatform }}-
            Library-${{ matrix.projectPath }}-
            Library-
      
      # Test Runner using Unity CLI
      - name: Run Tests
        id: testRunner
        run: |
          UNITY_PATH="/Applications/UnityInstalls/${{ matrix.unityVersion }}/Unity.app/Contents/MacOS/Unity"
          
          echo "Running Unity tests with CLI..."
          $UNITY_PATH \
            -batchmode \
            -nographics \
            -silent-crashes \
            -logFile - \
            -projectPath "${{ matrix.projectPath }}" \
            -runTests \
            -testPlatform ${{ matrix.testMode }} \
            -testResults "${{ matrix.projectPath }}/TestResults-${{ matrix.testMode }}.xml" \
            || echo "Tests completed with exit code $?"
        continue-on-error: true

      # Upload Test Artifacts
      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results for ${{ matrix.testMode }}
          path: |
            ${{ steps.testRunner.outputs.artifactsPath }}
            ${{ matrix.projectPath }}/TestResults-*.xml
          if-no-files-found: ignore

      # Build using Unity CLI
      - name: Build 
        run: |
          UNITY_PATH="/Applications/UnityInstalls/${{ matrix.unityVersion }}/Unity.app/Contents/MacOS/Unity"
          
          echo "Building for platform: ${{ matrix.targetPlatform }}"
          $UNITY_PATH \
            -batchmode \
            -nographics \
            -silent-crashes \
            -logFile - \
            -projectPath "${{ matrix.projectPath }}" \
            -buildTarget ${{ matrix.targetPlatform }} \
            -quit \
            || echo "Build completed with exit code $?"
          
  build-Zenject-Usage:
  
    runs-on: self-hosted
    
    name: Build Zenject-Usage
    
    env:
      DOTNET_NOLOGO: true

    steps:
    
    - uses: actions/checkout@v2
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 3.1.x
      
    - name: Build
      run: dotnet build AssemblyBuild\Zenject-usage.sln
      
    - name: Upload dll
      uses: actions/upload-artifact@v4
      with:
        name: Zenject-Usage
        path: AssemblyBuild/Zenject-Usage/Zenject-Usage/bin/Debug/netcoreapp3.1/Zenject-Usage.dll
        
  deployBuild:
  
    name: Deploy Build Zenject-Usage

    runs-on: self-hosted
    needs: build-Zenject-Usage
        
    steps:

    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Download Zenject-Usage
      uses: actions/download-artifact@v4
      with:
        name: UniDi-Usage

    - name: Install Zenject-Usage
      run: |
        ls -l Zenject-Usage
        cp Zeenject-Usage/Zenject-Usage.dll Source/Usage
        ls -l Source/Usage
