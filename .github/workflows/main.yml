jobs:
  buildAndTestForSupportedPlatforms:
    name: Build for ${{ matrix.buildTarget }} on version ${{ matrix.unityVersion }}
    runs-on: [self-hosted, macOS]
    env:
      UNITY_PATH: /Applications/UnityInstalls/${{ matrix.unityVersion }}/Unity.app/Contents/MacOS/Unity
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - UnityProject
        unityVersion:
          - 6000.0.65f1
        buildTarget:
          - Android
          - iOS
          - StandaloneOSX
          # Not yet supported GitHub actions:
          # - Android # Build a Android standalone.
          # - PS4 # Build a Playstation 4 standalone.
          # - Windows Store # Build a standalone for Windows Store devices.
          
    steps:

      #Checkout
      - uses: actions/checkout@v4
        with:
          lfs: true
      
      # Cache
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.projectPath }}-${{ matrix.buildTarget }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-
            Library-
            
      # Run Tests using Unity CLI
      - name: Run Tests
        id: testRunner
        run: |
          echo "Running Unity tests with CLI..."
          $UNITY_PATH \
            -batchmode \
            -nographics \
            -silent-crashes \
            -logFile - \
            -projectPath "${{ matrix.projectPath }}" \
            -runTests \
            -testPlatform EditMode \
            -testResults "${{ matrix.projectPath }}/TestResults-EditMode.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (editmode) - ${{ matrix.buildTarget }}
          path: |
            ${{ matrix.projectPath }}/TestResults-*.xml
            ${{ matrix.projectPath }}/Logs/
          if-no-files-found: ignore
        
      - name: Build
        run: |
          echo "Building for platform: ${{ matrix.buildTarget }}"
          mkdir -p build/${{ matrix.buildTarget }}
          
          $UNITY_PATH \
            -batchmode \
            -nographics \
            -silent-crashes \
            -logFile - \
            -projectPath "${{ matrix.projectPath }}" \
            -buildTarget ${{ matrix.buildTarget }} \
            -quit
      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.buildTarget }}
          path: build
          if-no-files-found: warn
    
  Zenject-usage:
    runs-on: [self-hosted, macOS]
    name: Zenject-usage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: MSBuild (macOS)
        working-directory: AssemblyBuild/Zenject-usage
        run: |
          set -e
          msbuild Zenject-usage.sln

      - name: Upload dll (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Zenject-usage-macOS
          path: AssemblyBuild/Zenject-usage/bin/Debug/
        
  buildUnity:
    name: Unity test
    runs-on: [self-hosted, macOS]
    needs: Zenject-usage
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
  
      # Checkout repository (required to test local actions)
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Download Zenject-usage
        uses: actions/download-artifact@v4
        with:
          name: Zenject-usage-macOS
          path: Zenject-usage-macOS

      - name: Install Zenject-usage
        run: |
          ls -l Zenject-usage-macOS
          cp Zenject-usage-macOS/Zenject-usage.dll UnityProject/Assets/Plugins/Zenject/Source/Usage
          ls -l UnityProject/Assets/Plugins/Zenject/Source/Usage
